<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<script>try{var t=localStorage.getItem("theme");if(!t&&matchMedia("(prefers-color-scheme: dark)").matches)t="dark";if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<title>Attendance | Izabela Dorinne P. Ronquillo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Nunito+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#F5F8FF; --surface:#FFFFFF; --ink:#23305A; --soft:#69769A; --line:#E0E7F6;
  --sky:#DCE8FC; --lav:#ECE8FD;
  --accent:#7C6CF0; --accent-dark:#6154D4; --on-accent:#FFFFFF;
  --blob1:#CFE0FF; --blob2:#DDD3FB; --blob3:#CDE6FB; --blob-o:.6; --sq2:#A99DF7; --ring:#D3CCF9; --th:#F7F6FF; --row-hover:#F5F8FF; --err:#C0504D;
  --ok-bg:#DDF3E8; --ok-fg:#23744F; --late-bg:#FFF0D2; --late-fg:#8A5A00; --abs-bg:#FDE1E0; --abs-fg:#B03A37;
  --serif:'DM Serif Display',Georgia,serif; --sans:'Nunito Sans','Segoe UI',sans-serif;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1426; --surface:#151D36; --ink:#E8ECFA; --soft:#9AA7C9; --line:#26304F;
  --sky:#1E2D55; --lav:#2A2455;
  --accent:#9B8CFF; --accent-dark:#B3A8FF; --on-accent:#14122E;
  --blob1:#1F3A7A; --blob2:#3B2F8A; --blob3:#1B4A7A; --blob-o:.32; --sq2:#6E62D6; --ring:#3A3470; --th:#1A2346; --row-hover:#1B2547; --err:#FF8A87;
  --ok-bg:#16382D; --ok-fg:#7FDDB5; --late-bg:#3D3016; --late-fg:#F2C46B; --abs-bg:#431F25; --abs-fg:#FF9E9A;
}
body,.card,.btn,.theme{transition:background-color .35s,border-color .35s,color .35s}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:1.02rem;line-height:1.7}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{position:relative;z-index:1;max-width:1280px;margin:0 auto;padding:44px 32px 90px}

/* background */
.blobs{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.blobs i{position:absolute;border-radius:50%;filter:blur(70px);opacity:var(--blob-o);animation:drift 18s ease-in-out infinite alternate}
.blobs i:nth-child(1){width:400px;height:400px;background:var(--blob1);top:-90px;left:-110px}
.blobs i:nth-child(2){width:360px;height:360px;background:var(--blob2);top:40%;right:-120px;animation-duration:23s;animation-delay:-6s}
.blobs i:nth-child(3){width:320px;height:320px;background:var(--blob3);bottom:-110px;left:35%;animation-duration:20s;animation-delay:-11s}

/* top bar + buttons */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;animation:rise .7s cubic-bezier(.2,.7,.2,1) backwards}
.btn{position:relative;overflow:hidden;display:inline-block;text-decoration:none;font:inherit;font-weight:600;font-size:.92rem;padding:10px 24px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);border-radius:999px;cursor:pointer;transition:background .2s,border-color .2s,transform .2s}
.btn:hover{background:var(--accent-dark);border-color:var(--accent-dark);transform:translateY(-2px)}
.btn.line{background:var(--surface);color:var(--accent-dark);border-color:var(--line)}
.btn.line:hover{background:var(--sky);border-color:var(--accent)}
.btn.danger{background:var(--abs-fg);border-color:var(--abs-fg)}
.btn.danger:hover{background:var(--abs-fg);border-color:var(--abs-fg);opacity:.88}
.btn:disabled{opacity:.6;cursor:wait}

/* heading */
.head{position:relative;margin:54px 0 28px;animation:rise .8s cubic-bezier(.2,.7,.2,1) .1s backwards}
.head::before{content:"";display:block;width:8px;height:8px;margin-bottom:14px;background:var(--accent);box-shadow:11px 0 0 var(--sq2),22px 0 0 var(--ring)}
.head h1{font-family:var(--serif);font-weight:400;font-size:clamp(2.4rem,6vw,4rem);line-height:1.1;margin:0 0 8px;background:linear-gradient(100deg,var(--ink) 25%,var(--accent) 55%,#5B8DEF 80%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s ease-in-out infinite alternate}
.head p{margin:0;color:var(--soft);font-size:1.1rem}
.head::after{content:"";position:absolute;right:30px;top:0;width:54px;height:54px;border-radius:50%;border:1.5px solid var(--ring);pointer-events:none}

/* card */
.card{min-height:460px;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 50px -35px rgba(124,108,240,.45);overflow:hidden;animation:rise .8s cubic-bezier(.2,.7,.2,1) .2s backwards}
.card-bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;padding:22px 32px;border-bottom:1px solid var(--line)}
.card-bar .acts{display:flex;gap:10px;flex-wrap:wrap}
.badge{font-size:.85rem;font-weight:600;padding:3px 14px;border-radius:999px;background:var(--lav);color:var(--accent-dark)}

/* filters */
.filters{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:14px;padding:16px 32px;border-bottom:1px solid var(--line);background:var(--th)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-weight:600;font-size:.9rem;display:inline-flex;align-items:center;gap:8px;padding:6px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;transition:background .2s,border-color .2s,transform .2s}
.chip:hover{border-color:var(--accent);transform:translateY(-1px)}
.chip small{font-size:.78rem;padding:0 8px;border-radius:999px;background:var(--lav);color:var(--accent-dark)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip[aria-pressed="true"] small{background:rgba(255,255,255,.28);color:var(--on-accent)}
.chip .dot{width:8px;height:8px;border-radius:50%}
.dot.present{background:var(--ok-fg)}.dot.late{background:var(--late-fg)}.dot.absent{background:var(--abs-fg)}
.search{width:260px;max-width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 18px}

/* table */
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:900px;font-size:1.02rem}
th,td{padding:16px 24px;text-align:left;white-space:nowrap}
th{font-weight:600;font-size:.92rem;color:var(--accent-dark);background:var(--th)}
td{border-top:1px solid var(--line);color:var(--ink)}
td.name{font-weight:600}
tbody tr{transition:background .2s}
tbody tr:hover{background:var(--row-hover)}
tbody.anim tr{animation:rise .5s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:calc(var(--i,0)*45ms)}
.st{display:inline-block;font-size:.84rem;font-weight:600;padding:3px 14px;border-radius:999px;background:var(--lav);color:var(--accent-dark)}
.st-present{background:var(--ok-bg);color:var(--ok-fg)}.st-late{background:var(--late-bg);color:var(--late-fg)}.st-absent{background:var(--abs-bg);color:var(--abs-fg)}
.act{text-align:right;display:flex;gap:8px;justify-content:flex-end}
.mini{font:inherit;font-size:.82rem;font-weight:600;padding:5px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--accent-dark);cursor:pointer;transition:background .2s,border-color .2s}
.mini:hover{background:var(--sky);border-color:var(--accent)}
.mini.del{color:var(--abs-fg)}.mini.del:hover{background:var(--abs-bg);border-color:var(--abs-fg)}

/* states */
.state{padding:110px 22px;font-size:1.1rem;text-align:center;color:var(--soft);margin:0}
.state.err{color:var(--err)}
.skeleton{padding:32px;display:grid;gap:20px}
.skeleton i{display:block;height:22px;border-radius:10px;background:linear-gradient(90deg,var(--lav),var(--th),var(--lav));background-size:200% 100%;animation:sk 1.4s linear infinite}
.skeleton i:nth-child(2){width:85%}.skeleton i:nth-child(3){width:70%}.skeleton i:nth-child(4){width:90%}

/* dialogs */
dialog{border:1px solid var(--line);border-radius:20px;background:var(--surface);color:var(--ink);padding:0;width:min(580px,calc(100% - 32px));box-shadow:0 30px 80px -30px rgba(40,30,120,.55)}
dialog::backdrop{background:rgba(14,20,38,.45);backdrop-filter:blur(4px)}
dialog[open]{animation:pop .3s cubic-bezier(.2,.8,.2,1)}
.dlg{padding:28px}
.dlg h2{font-family:var(--serif);font-weight:400;font-size:1.7rem;margin:0 0 6px}
.dlg .sub{margin:0 0 18px;color:var(--soft);font-size:.95rem}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fields .full{grid-column:1/-1}
label{font-weight:600;font-size:.88rem}
input:not(.search),select{width:100%;font:inherit;font-weight:400;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-top:6px}
input:focus,select:focus,.search:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px rgba(124,108,240,.18)}
.dlg-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
#formErr{color:var(--err);min-height:1.4em;margin:12px 0 0;font-weight:600;font-size:.92rem}
.toast{position:fixed;left:24px;bottom:24px;z-index:30;max-width:calc(100% - 48px);padding:12px 22px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:600;font-size:.92rem;box-shadow:0 14px 30px -14px rgba(0,0,0,.5);opacity:0;transform:translateY(14px);pointer-events:none;transition:opacity .3s,transform .3s}
.toast.show{opacity:1;transform:none}

/* theme toggle + back to top */
.right{display:flex;align-items:center;gap:12px}
.theme{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--accent-dark);cursor:pointer;transition:transform .25s,background .2s,border-color .2s}
.theme:hover{background:var(--sky);border-color:var(--accent);transform:rotate(18deg)}
.theme svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.theme .sun{display:none}
:root[data-theme="dark"] .theme .sun{display:block}
:root[data-theme="dark"] .theme .moon{display:none}
.totop{position:fixed;right:max(20px,env(safe-area-inset-right));bottom:max(20px,env(safe-area-inset-bottom));z-index:15;width:48px;height:48px;display:grid;place-items:center;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);cursor:pointer;box-shadow:0 14px 30px -12px rgba(124,108,240,.7);opacity:0;transform:translateY(16px) scale(.9);pointer-events:none;transition:opacity .3s,transform .3s,background .2s}
.totop.show{opacity:1;transform:none;pointer-events:auto}
.totop:hover{background:var(--accent-dark);transform:translateY(-3px)}
.totop svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

@keyframes rise{from{opacity:0;transform:translateY(22px)}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}}
@keyframes shine{to{background-position:100% 0}}
@keyframes drift{to{transform:translate(60px,80px) scale(1.15)}}
@keyframes sk{to{background-position:-200% 0}}
@media (max-width:640px){.wrap{padding:28px 18px 80px}.head::after{display:none}th,td{padding:14px 16px}.card-bar,.filters{padding:16px 18px}.card{min-height:380px}.fields{grid-template-columns:1fr}.search{width:100%}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="blobs" aria-hidden="true"><i></i><i></i><i></i></div>

<div class="wrap">
  <div class="top">
    <div class="right">
      <button class="btn line" id="loginBtn" type="button">Login</button>
      <button class="btn line" id="logoutBtn" type="button" hidden>Logout</button>
      <span class="badge" id="count" hidden></span>
      <button class="theme" id="themeBtn" type="button" aria-label="Switch to dark mode" aria-pressed="false">
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </div>

  <div class="head">
    <h1>Daily Attendance</h1>
    <p>Add, edit, delete and filter live attendance records.</p>
  </div>

  <div class="card">
    <div class="card-bar">
      <strong>Records</strong>
      <div class="acts">
        <button class="btn line" id="refreshBtn" type="button">Refresh</button>
        <button class="btn" id="addBtn" type="button">+ Add record</button>
      </div>
    </div>
    <div class="filters">
      <div class="chips" id="chips" role="group" aria-label="Filter by status"></div>
      <input class="search" id="search" type="search" placeholder="Search name, ID, subject…" aria-label="Search records">
    </div>
    <div id="daily_attendanceContainer" aria-live="polite">
      <div class="skeleton"><i></i><i></i><i></i><i></i></div>
    </div>
  </div>
</div>

<!-- Add / edit -->
<dialog id="formDlg" aria-labelledby="formTitle">
  <form class="dlg" id="recForm" method="dialog" novalidate>
    <h2 id="formTitle">Add record</h2>
    <p class="sub">Fill in the details below.</p>
    <div class="fields">
      <label>Student ID<input id="f_student_id" required autocomplete="off" placeholder="STU011"></label>
      <label>Date<input id="f_date" type="date" required></label>
      <label class="full">Student name<input id="f_student_name" required autocomplete="off" placeholder="Full name"></label>
      <label>Subject<input id="f_subject_name" required list="subjects" autocomplete="off" placeholder="Subject name"></label>
      <label>Section<input id="f_section" required list="sections" autocomplete="off" placeholder="BSIT-3A"></label>
      <label class="full">Status
        <select id="f_status" required><option>Present</option><option>Late</option><option>Absent</option></select>
      </label>
    </div>
    <datalist id="subjects"></datalist><datalist id="sections"></datalist>
    <p id="formErr" role="alert"></p>
    <div class="dlg-actions">
      <button class="btn line" type="button" id="cancelBtn">Cancel</button>
      <button class="btn" type="submit" id="saveBtn">Save</button>
    </div>
  </form>
</dialog>

<!-- Delete -->
<dialog id="delDlg" aria-labelledby="delTitle">
  <div class="dlg">
    <h2 id="delTitle">Delete record?</h2>
    <p class="sub" id="delText"></p>
    <p id="delErr" role="alert" style="color:var(--err);font-weight:600;margin:0"></p>
    <div class="dlg-actions">
      <button class="btn line" type="button" id="delCancel">Cancel</button>
      <button class="btn danger" type="button" id="delConfirm">Delete</button>
    </div>
  </div>
</dialog>

<!-- Login -->
<dialog id="loginDlg" aria-labelledby="loginTitle">
  <form class="dlg" id="loginForm" method="dialog" novalidate>
    <h2 id="loginTitle">Admin login</h2>
    <p class="sub">Enter admin credentials to add, edit, or delete records.</p>
    <div class="fields">
      <label class="full">Username<input id="l_user" required autocomplete="username"></label>
      <label class="full">Password<input id="l_pass" type="password" required autocomplete="current-password"></label>
    </div>
    <p id="loginErr" role="alert" style="color:var(--err);font-weight:600;margin:12px 0 0"></p>
    <div class="dlg-actions">
      <button class="btn line" type="button" id="loginCancel">Cancel</button>
      <button class="btn" type="submit">Login</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status"></div>
<button class="totop" id="toTop" type="button" aria-label="Back to top"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>

<script>
  // Endpoints: GET/POST on the collection, PUT/DELETE on /<_id>
  const API = 'https://student-api-backend-mu.vercel.app/api/daily_attendance';
  const $ = (id) => document.getElementById(id);
  const container = $('daily_attendanceContainer');
  const STATUSES = ['Present', 'Late', 'Absent'];
  const ADMIN_USER = 'admin';
  const ADMIN_PASS = 'admin123';
  let records = [], filter = 'All', query = '', editingId = null, deletingId = null;
  let isAdmin = sessionStorage.getItem('admin') === '1';
  let pendingAction = null;

  function syncAuth() {
    $('loginBtn').hidden = isAdmin;
    $('logoutBtn').hidden = !isAdmin;
  }
  function requireAuth(fn) {
    if (isAdmin) return fn();
    pendingAction = fn;
    $('loginErr').textContent = '';
    $('loginForm').reset();
    $('loginDlg').showModal();
    $('l_user').focus();
  }
  $('loginBtn').addEventListener('click', () => requireAuth(() => {}));
  $('logoutBtn').addEventListener('click', () => {
    isAdmin = false; sessionStorage.removeItem('admin'); syncAuth(); toast('Logged out.');
  });
  $('loginCancel').addEventListener('click', () => { pendingAction = null; $('loginDlg').close(); });
  $('loginForm').addEventListener('submit', (e) => {
    e.preventDefault();
    if ($('l_user').value.trim() === ADMIN_USER && $('l_pass').value === ADMIN_PASS) {
      isAdmin = true; sessionStorage.setItem('admin', '1'); syncAuth(); $('loginDlg').close(); toast('Logged in.');
      if (pendingAction) { const fn = pendingAction; pendingAction = null; fn(); }
    } else {
      $('loginErr').textContent = 'Invalid username or password.';
    }
  });
  syncAuth();

  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const dateInput = (d) => d ? String(d).slice(0, 10) : '';
  const dateShow = (d) => d ? new Date(d).toLocaleDateString('en-PH', { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' }) : '';

  async function request(method, url, body) {
    const res = await fetch(url, {
      method,
      headers: body ? { 'Content-Type': 'application/json' } : undefined,
      body: body ? JSON.stringify(body) : undefined
    });
    if (!res.ok) throw new Error('Request failed (' + res.status + ')');
    return res.status === 204 ? null : res.json().catch(() => null);
  }

  let toastTimer;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
  }

  // ----- Render -----
  function renderChips() {
    const counts = { All: records.length };
    STATUSES.forEach(s => counts[s] = records.filter(r => r.status === s).length);
    $('chips').innerHTML = ['All', ...STATUSES].map(s =>
      '<button class="chip" type="button" data-status="' + s + '" aria-pressed="' + (filter === s) + '">' +
      (s === 'All' ? '' : '<span class="dot ' + s.toLowerCase() + '"></span>') + s + '<small>' + counts[s] + '</small></button>'
    ).join('');
  }

  function visible() {
    const q = query.trim().toLowerCase();
    return records.filter(r =>
      (filter === 'All' || r.status === filter) &&
      (!q || [r.student_id, r.student_name, r.subject_name, r.section].some(v => String(v ?? '').toLowerCase().includes(q)))
    );
  }

  function render(animate) {
    renderChips();
    const list = visible();
    const badge = $('count');
    badge.textContent = list.length + ' of ' + records.length + ' records';
    badge.hidden = !records.length;

    if (!records.length) { container.innerHTML = '<p class="state">No attendance records yet. Press “Add record” to create one.</p>'; return; }
    if (!list.length) { container.innerHTML = '<p class="state">No records match your filter.</p>'; return; }

    container.innerHTML = '<div class="scroll"><table><thead><tr><th>Student ID</th><th>Name</th><th>Subject</th><th>Section</th><th>Date</th><th>Status</th><th></th></tr></thead><tbody' + (animate ? ' class="anim"' : '') + '>' +
      list.map((r, i) =>
        '<tr style="--i:' + Math.min(i, 12) + '" data-id="' + esc(r._id) + '">' +
        '<td>' + esc(r.student_id) + '</td><td class="name">' + esc(r.student_name) + '</td><td>' + esc(r.subject_name) + '</td><td>' + esc(r.section) + '</td>' +
        '<td>' + esc(dateShow(r.date)) + '</td>' +
        '<td><span class="st st-' + esc(String(r.status).toLowerCase().replace(/[^a-z]/g, '')) + '">' + esc(r.status) + '</span></td>' +
        '<td><div class="act"><button class="mini" type="button" data-act="edit">Edit</button><button class="mini del" type="button" data-act="del">Delete</button></div></td></tr>'
      ).join('') + '</tbody></table></div>';
  }

  function fillSuggestions() {
    const uniq = (k) => [...new Set(records.map(r => r[k]).filter(Boolean))].map(v => '<option value="' + esc(v) + '">').join('');
    $('subjects').innerHTML = uniq('subject_name');
    $('sections').innerHTML = uniq('section');
  }

  // ----- Load -----
  async function loadRecords(skeleton = true) {
    $('refreshBtn').disabled = true;
    if (skeleton) container.innerHTML = '<div class="skeleton"><i></i><i></i><i></i><i></i></div>';
    try {
      const data = await request('GET', API);
      records = Array.isArray(data) ? data : [];
      fillSuggestions();
      render(skeleton);
    } catch (e) {
      container.innerHTML = '<p class="state err">Error loading records. Check your connection and press Refresh.</p>';
      $('count').hidden = true;
    } finally {
      $('refreshBtn').disabled = false;
    }
  }

  // ----- Filters -----
  $('chips').addEventListener('click', (e) => {
    const b = e.target.closest('[data-status]');
    if (b) { filter = b.dataset.status; render(false); }
  });
  $('search').addEventListener('input', (e) => { query = e.target.value; render(false); });

  // ----- Add / edit -----
  const fields = ['student_id', 'student_name', 'subject_name', 'section', 'date', 'status'];
  function openForm(rec) {
    editingId = rec ? rec._id : null;
    $('formTitle').textContent = rec ? 'Edit record' : 'Add record';
    fields.forEach(f => {
      $('f_' + f).value = rec ? (f === 'date' ? dateInput(rec.date) : rec[f] ?? '') : (f === 'status' ? 'Present' : f === 'date' ? new Date().toISOString().slice(0, 10) : '');
    });
    $('formErr').textContent = '';
    $('formDlg').showModal();
    $('f_student_id').focus();
  }
  $('addBtn').addEventListener('click', () => requireAuth(() => openForm(null)));
  $('cancelBtn').addEventListener('click', () => $('formDlg').close());

  $('recForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const body = {};
    fields.forEach(f => body[f] = $('f_' + f).value.trim());
    if (fields.some(f => !body[f])) { $('formErr').textContent = 'Please fill in every field.'; return; }
    $('saveBtn').disabled = true;
    try {
      await request(editingId ? 'PUT' : 'POST', editingId ? API + '/' + encodeURIComponent(editingId) : API, body);
      $('formDlg').close();
      toast(editingId ? 'Record updated.' : 'Record added.');
      await loadRecords(false);
    } catch (err) {
      $('formErr').textContent = 'Could not save the record. Please try again.';
    } finally {
      $('saveBtn').disabled = false;
    }
  });

  // ----- Edit / delete buttons -----
  container.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    const id = btn.closest('tr').dataset.id;
    const rec = records.find(r => r._id === id);
    if (!rec) return;
    if (btn.dataset.act === 'edit') return requireAuth(() => openForm(rec));
    deletingId = id;
    $('delText').textContent = 'This will permanently remove ' + rec.student_name + '’s record for ' + dateShow(rec.date) + '.';
    $('delErr').textContent = '';
    requireAuth(() => $('delDlg').showModal());
  });
  $('delCancel').addEventListener('click', () => $('delDlg').close());
  $('delConfirm').addEventListener('click', async () => {
    $('delConfirm').disabled = true;
    try {
      await request('DELETE', API + '/' + encodeURIComponent(deletingId));
      $('delDlg').close();
      toast('Record deleted.');
      await loadRecords(false);
    } catch (err) {
      $('delErr').textContent = 'Could not delete the record. Please try again.';
    } finally {
      $('delConfirm').disabled = false;
    }
  });
  document.querySelectorAll('dialog').forEach(d => d.addEventListener('click', (e) => { if (e.target === d) d.close(); }));

  $('refreshBtn').addEventListener('click', () => loadRecords(true));
  loadRecords(true);

  // ----- Dark mode (shared with the portfolio) -----
  const root = document.documentElement;
  const themeBtn = $('themeBtn');
  function syncTheme() {
    const dark = root.dataset.theme === 'dark';
    themeBtn.setAttribute('aria-pressed', dark);
    themeBtn.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
  }
  themeBtn.addEventListener('click', () => {
    const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
    root.dataset.theme = next;
    try { localStorage.setItem('theme', next); } catch (e) {}
    syncTheme();
  });
  syncTheme();

  // ----- Back to top -----
  const toTop = $('toTop');
  toTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
  addEventListener('scroll', () => toTop.classList.toggle('show', scrollY > 400), { passive: true });
</script>
</body>
</html>
